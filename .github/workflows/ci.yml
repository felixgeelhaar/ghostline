name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A newer push to a pull request supersedes its older run, so that run may be
  # cancelled. Every push to main gets its own group (the run ID), so no main run
  # is cancelled or replaced while pending: every merged revision keeps its own
  # CI result.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: Go checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Test scheduled day lock
        run: bash .agents/skills/ghostline-ready-issue/scripts/test-day-lock.sh
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  production-container:
    name: Production container smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Build production image
        run: docker build --tag ghostline:ci .
      - name: Start with required authentication
        run: |
          docker run --detach --name ghostline-ci \
            --publish 127.0.0.1:18080:8080 \
            --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --env GITHUB_OAUTH_CLIENT_ID=ci-client \
            --env GITHUB_OAUTH_CLIENT_SECRET=ci-secret \
            --env GITHUB_OAUTH_CALLBACK_URL=https://ghostline.example/auth/callback \
            --env GHOSTLINE_SESSION_SECRET="$(printf 'c%.0s' $(seq 1 40))" \
            --env GHOSTLINE_ALLOWED_GITHUB_IDS=42 \
            ghostline:ci
      - name: Verify frontend and protected API
        run: |
          trap 'docker logs ghostline-ci; docker rm -f ghostline-ci >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:18080/api/health >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:18080/ | grep -q '<div id="app">'
          curl --fail --silent http://127.0.0.1:18080/api/session | grep -q '"authRequired":true'
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' --request POST --header 'Content-Type: application/json' --data '{}' http://127.0.0.1:18080/api/import)
          test "$status" = 401
