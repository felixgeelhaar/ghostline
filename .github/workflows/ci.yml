name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A newer push to a pull request supersedes its older run, so that run may be
  # cancelled. Every push to main gets its own group (the run ID), so no main run
  # is cancelled or replaced while pending: every merged revision keeps its own
  # CI result.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: Go checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Test scheduled day lock
        run: bash .agents/skills/ghostline-ready-issue/scripts/test-day-lock.sh
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  container:
    name: Production container
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GHOSTLINE_ENV: production
      GHOSTLINE_AUTH_MODE: github
      GITHUB_OAUTH_CLIENT_ID: ghostline-ci
      GITHUB_OAUTH_CLIENT_SECRET: ci-placeholder-secret
      GITHUB_OAUTH_CALLBACK_URL: https://ghostline.example/auth/github/callback
      GHOSTLINE_SESSION_SIGNING_KEY: ci-only-session-signing-key-at-least-32-bytes
      GHOSTLINE_ALLOWED_GITHUB_USERS: ghostline-ci
      RATE_LIMIT_CLIENT_IP_HEADER: X-Ghostline-Client-IP
      RATE_LIMIT_TRUSTED_PROXIES: 127.0.0.1/32
      GHOSTLINE_PORT: 18080
    steps:
      - name: Check out revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and start production container
        run: docker compose up --build --detach
      - name: Smoke test health endpoint and embedded frontend
        run: |
          curl --fail --silent --show-error --retry 12 --retry-connrefused --retry-delay 5 "http://127.0.0.1:${GHOSTLINE_PORT}/api/health" | grep -q '"status":"ok"'
          curl --fail --silent --show-error --retry 12 --retry-connrefused --retry-delay 5 "http://127.0.0.1:${GHOSTLINE_PORT}/" | grep -qi '<title>Ghostline'
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop production container
        if: always()
        run: docker compose down --volumes --remove-orphans
