name: Security scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  nox:
    name: Nox security scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Scan repository with Nox
        id: nox
        uses: nox-hq/nox@7879126c43eaed7de3555e279873ba784b5f72a2 # v1.57.0 action source
        with:
          path: .
          version: 1.57.0
          format: all
          output: nox-results
          fail-on-findings: false
          fail-on-degraded: false
          annotate: false

      - name: Keep scan reports with this run
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: nox-reports
          path: nox-results/
          if-no-files-found: warn
