name: Security

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  nox:
    name: Security (nox)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      pull-requests: write
    steps:
      # Scan the pull request's head commit, not GitHub's merge preview: the
      # report and artifact are attributed to the head SHA, so the scanned
      # tree must be exactly that revision.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      # Nox 1.67.0 includes the severity-specific SARIF rule descriptors from
      # Nox-HQ/nox#1068. Keep the action and scanner versions explicit.
      - name: Run Nox security scan
        id: scan
        uses: nox-hq/nox@c030244316e7654bb7ad4694b5eb5b0266141ff9 # v1.39.2
        with:
          path: .
          version: 1.67.0
          format: json,sarif
          output: nox-results
          fail-on-findings: 'false'
          fail-on-degraded: 'true'

      - name: Upload SARIF to code scanning
        if: always() && steps.scan.outputs.sarif-file != ''
        uses: github/codeql-action/upload-sarif@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4
        with:
          sarif_file: ${{ steps.scan.outputs.sarif-file }}
          # Attribute code-scanning results to the commit that was scanned.
          sha: ${{ github.event.pull_request.head.sha || github.sha }}
          ref: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.pull_request.number) || github.ref }}

      # The Marketplace action puts its verified Nox binary on PATH, so use
      # Nox's baseline-aware gate directly rather than scripting a second gate.
      - name: Gate on new Nox findings
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: nox ci-gate --input nox-results/findings.json --baseline .nox/baseline.json --github

      - name: Upload Nox artifacts
        if: always() && hashFiles('nox-results/**') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nox-results
          path: nox-results/
          retention-days: 7

  report-nox-issues:
    name: nox / Report findings
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.nox.result != 'cancelled'
    needs: [nox]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Queue every main-branch report: with the default single pending slot, a newer
    # run would replace a pending one and that scan's findings would never be filed.
    concurrency:
      group: nox-issue-sync-${{ github.repository }}
      cancel-in-progress: false
      queue: max
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - name: Check out revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download Nox report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nox-results
          path: nox-results

      - name: Create or reopen finding issues
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('node:fs');
            const { reportNoxIssues } = require('./.github/scripts/report-nox-issues.cjs');
            const report = JSON.parse(fs.readFileSync('nox-results/findings.json', 'utf8'));
            const baseline = JSON.parse(fs.readFileSync('.nox/baseline.json', 'utf8'));
            const counts = await reportNoxIssues({ github, context, report, baseline });
            core.info(`Nox issue sync: ${JSON.stringify(counts)}`);
