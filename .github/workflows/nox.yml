name: Security scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  nox:
    name: Nox security scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Nox 1.57.0
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/nox_1.57.0_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error \
            https://github.com/Nox-HQ/nox/releases/download/v1.57.0/nox_1.57.0_linux_amd64.tar.gz \
            --output "$archive"
          echo 'db25d1d9c8a7e17782a80ba12f152ed7ae0db05f67af73bf502d81ee3fee98dd  '"$archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/nox"
          tar -xzf "$archive" -C "$RUNNER_TEMP/nox"
          "$RUNNER_TEMP/nox/nox" --version

      - name: Scan repository
        shell: bash
        run: |
          set -uo pipefail
          "$RUNNER_TEMP/nox/nox" --format all --output nox-results -q scan . || scan_exit=$?
          scan_exit="${scan_exit:-0}"
          if (( scan_exit > 1 )); then
            echo "Nox could not complete the scan (exit $scan_exit)."
            exit "$scan_exit"
          fi
          if (( scan_exit == 1 )); then
            echo "Nox reported findings. See the attached reports; findings do not currently block merges."
          else
            echo "Nox completed without findings."
          fi

      - name: Keep scan reports with this run
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: nox-reports
          path: nox-results/
          if-no-files-found: warn
