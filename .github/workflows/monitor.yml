name: Synthetic monitor

# Checks the signed-out journey on the production deployment every 30 minutes.
# A failed run opens (or comments on) one alert issue, which notifies the
# repository's watchers; the next passing run with the real assertion closes it.
# See docs/synthetic-monitoring.md.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      expect_app:
        description: >-
          OAuth app name GitHub must show. Keep "Ghostline" for a real check; any
          other value is a controlled failure that exercises the alert route.
        required: true
        default: Ghostline

permissions:
  contents: read

concurrency:
  group: synthetic-monitor
  cancel-in-progress: false

env:
  ALERT_TITLE: "Synthetic monitor: signed-out journey failing"

jobs:
  signin:
    name: Signed-out journey
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Read the pinned release
        id: release
        run: |
          version=$(grep -m1 -oE 'ghcr\.io/felixgeelhaar/ghostline:v[0-9A-Za-z.-]+@' .rollops/deploy-ghostline.yaml | sed -E 's/.*:(v[^@]+)@/\1/')
          test -n "$version" || { echo "::error::no pinned ghostline image in .rollops/deploy-ghostline.yaml"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Check the signed-out journey
        id: check
        env:
          EXPECT_VERSION: ${{ steps.release.outputs.version }}
          EXPECT_APP: ${{ inputs.expect_app || 'Ghostline' }}
        run: |
          set -o pipefail
          go run ./tools/signin-monitor -expect-version "$EXPECT_VERSION" -expect-app "$EXPECT_APP" | tee monitor.txt
      - name: Record the result
        if: always() && steps.release.outcome == 'success'
        run: |
          { echo '```text'; cat monitor.txt 2>/dev/null || echo "the check produced no output"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Raise the alert
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          EXPECT_APP: ${{ inputs.expect_app || 'Ghostline' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          kind="Scheduled check"
          if [ "$EVENT" = workflow_dispatch ]; then
            kind="Manual check (expect_app: \`$EXPECT_APP\`)"
          fi
          {
            echo "**$kind failed** at $(date -u +%Y-%m-%dT%H:%M:%SZ) on \`$GITHUB_SHA\`: $RUN_URL"
            echo
            echo '```text'
            cat monitor.txt 2>/dev/null || echo "the check produced no output; see the run log"
            echo '```'
          } > alert.md
          issue=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "\"$ALERT_TITLE\" in:title" --json number,title \
            --jq "[.[] | select(.title == env.ALERT_TITLE)][0].number // empty")
          if [ -n "$issue" ]; then
            gh issue comment "$issue" -R "$GITHUB_REPOSITORY" --body-file alert.md
          else
            gh issue create -R "$GITHUB_REPOSITORY" --title "$ALERT_TITLE" --body-file alert.md
          fi
      - name: Close a recovered alert
        if: success() && (inputs.expect_app || 'Ghostline') == 'Ghostline'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          issue=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "\"$ALERT_TITLE\" in:title" --json number,title \
            --jq "[.[] | select(.title == env.ALERT_TITLE)][0].number // empty")
          if [ -n "$issue" ]; then
            gh issue close "$issue" -R "$GITHUB_REPOSITORY" --comment "Passed again at $(date -u +%Y-%m-%dT%H:%M:%SZ) on \`$GITHUB_SHA\`: $RUN_URL"
          fi
