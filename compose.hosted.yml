services:
  ghostline:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.hosted
    environment:
      GHOSTLINE_SESSION_SECRET: ${GHOSTLINE_SESSION_SECRET:?Provide this value through the host secret manager}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:?Provide this value through the host secret manager}
      HOST: 0.0.0.0
      PORT: 8080
      GHOSTLINE_ENV: production
      GHOSTLINE_AUTH_MODE: required
      GHOSTLINE_STATIC_DIR: /app/frontend/dist
    ports:
      - "${GHOSTLINE_BIND_ADDRESS:-127.0.0.1}:${GHOSTLINE_PORT:-8080}:8080"
    restart: unless-stopped
    # Longer than GHOSTLINE_SHUTDOWN_GRACE (25s) so in-flight requests finish before SIGKILL.
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "/ghostline", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
