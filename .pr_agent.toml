[github_app]
# Add source-linked summaries and review feedback to each published or updated PR.
pr_commands = ["/agentic_describe", "/agentic_review"]

[review_agent]
issues_user_guidelines = """
Use the linked issue and its acceptance criteria as the source of functional expectations,
and follow the repository's AGENTS.md. Ground each finding in the changed code and state
its concrete impact. Preserve evidence boundaries: a timestamp is not proof of causation,
a later commit is not proof that a review finding was fixed, and checks only apply to the
revision they actually inspected. Distinguish observed facts from inferred relationships.
Report actionable correctness, security, and requirement issues; avoid speculative claims
and style-only feedback. When evidence is insufficient, say what is missing instead of
presenting an assumption as a finding.
"""

[qodo_describe_agent]
# Expose Qodo's review effort estimate in the GitHub pull request list.
publish_review_time_estimate_labels = true
