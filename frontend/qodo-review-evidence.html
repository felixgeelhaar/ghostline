  <head>

      body { min-height: 100vh; padding: 28px; background: #090b16; }

      import { createApp } from 'vue'
      import StructuredQodoReview from '/src/presentation/StructuredQodoReview.vue'

      const sha = 'a'.repeat(40)
      createApp(StructuredQodoReview, {
        pullRequestUrl: 'https://github.com/acme/payments/pull/42',
        headSha: 'b'.repeat(40),
        review: {
          availability: 'available',
          source: 'Qodo Agentic Toolbox · get-pr-review-findings',
          reviewSession: null,
          findings: [{
            id: 'finding-demo-1',
            title: 'Keep findings visible without session metadata',
            description: 'A structured finding is still source evidence when Qodo omits the session envelope.',
            category: 'Correctness',
            actionLevel: 'action_required',
            gitSha: sha,
            filePath: 'backend/review.go',
            startLine: 28,
            side: 'RIGHT',
            evidence: { explanation: 'Prepared replay data demonstrates a finding retained without session metadata.', citations: [] },
          }],
          reviewRuns: [],
        },
      }).mount('#app')
