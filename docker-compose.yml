services:
  ghostline:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      GHOSTLINE_ENV: ${GHOSTLINE_ENV:-production}
      GHOSTLINE_AUTH_MODE: ${GHOSTLINE_AUTH_MODE:-github}
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:?Set GITHUB_OAUTH_CLIENT_ID}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:?Set GITHUB_OAUTH_CLIENT_SECRET}
      GITHUB_OAUTH_CALLBACK_URL: ${GITHUB_OAUTH_CALLBACK_URL:?Set GITHUB_OAUTH_CALLBACK_URL}
      GHOSTLINE_SESSION_SIGNING_KEY: ${GHOSTLINE_SESSION_SIGNING_KEY:?Set GHOSTLINE_SESSION_SIGNING_KEY}
      GHOSTLINE_ALLOWED_GITHUB_USERS: ${GHOSTLINE_ALLOWED_GITHUB_USERS:?Set GHOSTLINE_ALLOWED_GITHUB_USERS}
      GHOSTLINE_SESSION_COOKIE_SECURE: ${GHOSTLINE_SESSION_COOKIE_SECURE:-true}
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-30}
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-1m}
      RATE_LIMIT_CLIENT_IP_HEADER: ${RATE_LIMIT_CLIENT_IP_HEADER:?Set the proxy-overwritten client IP header}
      RATE_LIMIT_TRUSTED_PROXIES: ${RATE_LIMIT_TRUSTED_PROXIES:?Set the exact trusted proxy CIDR range}
    ports:
      - "${GHOSTLINE_BIND_ADDRESS:-127.0.0.1}:${GHOSTLINE_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
